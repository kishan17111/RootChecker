      - name: Make app icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil
          python3 mkicon.py
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FRIENDLY-Checking.apk
      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FRIENDLY Checking build ${{ github.run_number }}
          files: FRIENDLY-Checking.apk
          
