name: Build APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unpack project
        run: |
          base64 -d <<'E' | tar xJ
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          GNhsem33AaqPvCx4F9/Nyqr7dODDrTYwVfoM3PIByWrdidYpMv0ToIkYpsjNuhpp5Dtzcjnlg/BkGZR0YVbPEQzfy9WPTgzdYO0Nhq5efKoRYvpEr8GZZx0AAABA968Kan4nGgABtl6AsAQAMNiOxLHEZ/sCAAAAAARZWg==
          E
      - name: Make icons
        run: |
          ok=0
          if [ -f icon.png ]; then
            python3 -m venv /tmp/v && /tmp/v/bin/pip install -q pillow && /tmp/v/bin/python mkicon.py && ok=1
          fi
          [ $ok = 1 ] || cp -r fallback/res/. app/src/main/res/
      - name: Build debug APK
        shell: bash
        run: |
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log || { { echo '```'; grep -m1 -A25 'What went wrong' build.log || tail -40 build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RootCheck.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RootCheck build ${{ github.run_number }}
          files: RootCheck.apk
          
