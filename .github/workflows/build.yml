      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unpack project
        run: |
          tr -d '\n' <<'E' | python3 -c "import sys,base64;sys.stdout.buffer.write(base64.b85decode(sys.stdin.read()))" | tar xJ
